<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="XIV Chocobox · 陆行鸟音乐盒，从本地 FINAL FANTASY XIV 聆听音乐。"><meta name="theme-color" content="#171310">
<title>XIV Chocobox · 陆行鸟音乐盒</title>
<script>
(() => {
  const tags = { zh: 'zh-CN', en: 'en', ja: 'ja' };
  const titles = { zh: 'XIV Chocobox · 陆行鸟音乐盒', en: 'XIV Chocobox · FFXIV Music Box', ja: 'XIV Chocobox · FFXIV 音楽箱' };
  const valid = value => Object.prototype.hasOwnProperty.call(tags, value);
  const detect = () => {
    const values = [...(navigator.languages || []), navigator.language];
    for (const value of values) {
      const tag = String(value || '').toLowerCase();
      if (tag.startsWith('zh')) return 'zh';
      if (tag.startsWith('ja')) return 'ja';
      if (tag.startsWith('en')) return 'en';
    }
    return 'zh';
  };
  let language = '';
  try {
    const saved = localStorage.getItem('xiv-player-language');
    if (valid(saved)) language = saved;
  } catch {}
  if (!language) language = detect();
  document.documentElement.dataset.initialLanguage = language;
  document.documentElement.lang = tags[language];
  document.documentElement.classList.add('i18n-pending');
  document.title = titles[language];
})();
</script>
<link rel="icon" type="image/png" sizes="1536x1536" href="./assets/chocobox-icon.png"><link rel="apple-touch-icon" href="./assets/chocobox-icon.png"><link rel="stylesheet" href="./style.css?v=20260913-39">
</head>
<body>
<header class="topbar"><div class="brand"><img class="brand-icon" src="./assets/chocobox-icon.png" alt="" aria-hidden="true"><strong>XIV Chocobox</strong><span class="muted" data-i18n="brand.subtitle">陆行鸟音乐盒</span></div><div class="header-actions"><button id="language-toggle" class="icon-button" popovertarget="language-menu" data-i18n-aria-label="language.label" data-i18n-title="language.label" aria-label="语言" title="语言" data-icon="globe"></button><button id="settings-open" class="icon-button" data-i18n-aria-label="settings" data-i18n-title="settings" data-icon="settings"></button></div></header>
<main class="workspace">
<section class="library" data-i18n-aria-label="library">
<div class="library-heading"><h1 data-i18n="library.title">曲库</h1><span id="track-count" class="muted">尚未载入</span></div>
<div class="search-bar"><label class="search"><span class="sr-only" data-i18n="library.searchAria">搜索曲名、资源名或用途</span><input id="search" type="search" data-i18n-placeholder="library.searchPlaceholder" placeholder="搜索音乐或用途" disabled></label><button id="filter-toggle" class="icon-button filter-toggle" type="button" popovertarget="filter-menu" data-i18n-aria-label="library.filter" data-i18n-title="library.filter" aria-label="筛选" title="筛选" aria-controls="filter-menu" aria-expanded="false"><span data-icon="filter" aria-hidden="true"></span></button></div>
<div class="library-filters"><div class="filters" role="group" data-i18n-aria-label="library.trackType"><button class="filter active" data-kind="bgm" aria-pressed="true" data-i18n="library.bgm">游戏配乐</button><button class="filter" data-kind="orchestrion" aria-pressed="false" data-i18n="library.orchestrion" data-i18n-title="library.orchestrionTitle" title="用于游戏内房屋的管弦乐谱，音质可能会更低">管弦乐谱</button></div></div>
<div id="filter-menu" class="filter-menu" popover><div class="filter-menu-section"><div class="feature-filters" role="group" data-i18n-aria-label="library.featureFilters"><button class="feature-filter" data-feature="loop" aria-pressed="false" data-i18n-title="library.hasLoopTitle" data-i18n-aria-label="library.hasLoop" title="只显示有循环的曲目" aria-label="有循环"><span data-icon="repeat" aria-hidden="true"></span><span data-i18n="library.hasLoop">有循环</span></button><button class="feature-filter" data-feature="variant" aria-pressed="false" data-i18n-title="library.hasVariantTitle" data-i18n-aria-label="library.hasVariant" title="只显示有多音轨的曲目" aria-label="有多音轨"><span data-icon="variant" aria-hidden="true"></span><span data-i18n="library.hasVariant">有多音轨</span></button></div></div></div>
<p id="library-status" class="status" role="status" data-i18n="library.initialStatus">选择游戏根目录或 game 文件夹，即可载入曲库。</p><div id="tracks" class="tracks" data-i18n-aria-label="library.trackList" aria-label="曲目列表"></div>
</section>
<section class="player" data-i18n-aria-label="player"><div class="player-content">
<div id="cover" class="cover" role="img" data-i18n-aria-label="cover.default" aria-label="默认音乐封面"><span data-icon="music" aria-hidden="true"></span><span class="cover-caption">XIV Chocobox</span></div>
<div class="track-title"><h2 id="title" data-i18n="player.continue">让旋律继续</h2><p id="description" data-i18n="player.selectTrack">从曲库选择一首音乐</p></div>
<div class="timeline-panel"><div class="timeline-caption"><span id="position-current" class="time">00:00</span><span id="position-total" class="time">00:00</span></div>
<div id="timeline" class="timeline" aria-busy="false"><div class="timeline-visual" aria-hidden="true"><div id="loop-band" class="loop-band" hidden></div><div id="played" class="played"></div><div id="marks" class="marks debug-only"></div><div class="loading-shimmer"></div></div><div class="switch-flash"></div><input id="seek" type="range" min="0" max="1" value="0" step="0.01" data-i18n-aria-label="player.progress" aria-label="播放位置"></div>
<div class="playback-hints">
<div class="hint-side hint-side-left"><button id="loop-toggle" class="hint-icon-button" disabled popovertarget="loop-menu" data-i18n-aria-label="loop.title" data-i18n-title="loop.title" aria-label="曲内循环设置" title="曲内循环设置"><span data-icon="repeat" aria-hidden="true"></span></button><span id="loop-status" class="hint-status" aria-live="polite"></span></div>
<div class="hint-side hint-side-right"><span id="variant-status" class="hint-status" aria-live="polite"></span><button id="variant-toggle" class="hint-icon-button" disabled data-i18n-aria-label="variant.switch" data-i18n-title="variant.none" aria-label="切换音轨" title="此曲目没有可切换音轨"><span data-icon="variant" aria-hidden="true"></span></button></div>
</div></div>
<div class="transport">
<div class="volume-control"><button id="volume-toggle" type="button" class="icon-button" data-i18n-aria-label="player.volume" data-i18n-title="player.volume" aria-label="音量" title="音量" aria-controls="volume-popover"><span id="volume-icon" data-icon="volume" aria-hidden="true"></span></button><div id="volume-popover" class="volume-popover" role="group" data-i18n-aria-label="player.volume" aria-label="音量"><label class="volume-slider"><span class="sr-only" data-i18n="player.volume">音量</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" data-i18n-aria-label="player.volume" aria-label="音量"></label></div></div>
<button id="previous" class="icon-button" disabled data-i18n-aria-label="player.previous" data-i18n-title="player.previous" aria-label="上一首" title="上一首" data-icon="previous"></button>
<button id="play" class="icon-button play" disabled data-i18n-aria-label="player.play" data-i18n-title="player.play" aria-label="播放" title="播放" data-icon="play"></button>
<button id="next" class="icon-button" disabled data-i18n-aria-label="player.next" data-i18n-title="player.next" aria-label="下一首" title="下一首" data-icon="next"></button>
<button id="playback-order" class="icon-button" aria-label="播放顺序：顺序播放" title="播放顺序：顺序播放（点击切换）"><span id="playback-order-icon" data-icon="order" aria-hidden="true"></span></button>
</div>
</div><div class="player-footer"><p id="player-status" class="status" role="status"></p><button id="info-toggle" class="icon-button" disabled data-i18n-aria-label="player.info" data-i18n-title="player.info" aria-label="曲目信息" title="曲目信息" aria-controls="track-info-panel" aria-expanded="false" data-icon="info"></button></div><section id="track-info-panel" class="track-info-panel" hidden data-i18n-aria-label="player.info" aria-label="曲目信息"><dl id="info-summary"></dl><details id="track-details" class="debug-only" hidden><summary data-i18n="info.technical">技术信息</summary><span id="codec" class="badge"></span><dl id="metadata"></dl></details></section></section>
</main>
<footer><span data-i18n="footer.source">音乐来自你的本地游戏</span><span>v61</span></footer>
<div id="loop-menu" class="popover loop-menu" popover><h3 data-i18n="loop.title">曲内循环</h3><div class="loop-controls"><label class="loop-setting loop-switch"><span data-i18n="loop.enabled">启用循环</span><input id="loop-enabled" type="checkbox" checked data-i18n-aria-label="loop.enabled" aria-label="启用循环"></label><label class="loop-setting loop-count"><span data-i18n="loop.count">循环次数</span><span class="loop-count-input"><input id="loop-limit" type="number" min="0" max="999" step="1" value="3" data-i18n-aria-label="loop.limitAria" data-i18n-title="loop.countTitle" aria-label="循环区间播放次数" title="0 表示无限循环"><span data-i18n="loop.limitSuffix">次</span></span></label><p class="loop-count-help" data-i18n="loop.countHelp">0 表示无限循环</p></div></div>
<dialog id="settings-menu"><div class="dialog-heading"><h2 data-i18n="settings">设置</h2><button id="settings-close" class="icon-button" data-i18n-aria-label="dialog.close" data-i18n-title="dialog.close" aria-label="关闭" title="关闭" data-icon="close"></button></div>
<div class="setting-row directory-setting"><span><span data-i18n="settings.directory">资源目录</span><small id="directory-path" data-i18n-title="settings.notSelected" title="尚未选择" data-i18n="settings.notSelected">尚未选择</small></span><button id="directory-select" class="button" data-i18n="settings.chooseAgain">重新选择</button></div>
<label class="setting-row"><span><span data-i18n="settings.multichannel">多声道试听</span><small data-i18n="settings.multichannelHelp">手动选择声道或立体声轨</small></span><input id="show-channels" type="checkbox"></label>
<label class="setting-row"><span><span data-i18n="settings.debug">显示技术信息</span><small data-i18n="settings.debugHelp">在曲目信息中显示资源路径、编码详情与切换节点</small></span><input id="show-debug" type="checkbox"></label>
<section id="channel-panel" class="channel-panel" hidden data-i18n-aria-label="settings.channelPanel" aria-label="多声道试听"><div class="channel-heading"><h3 data-i18n="settings.channelPanel">多声道试听</h3><button id="channel-all" class="button" data-i18n="settings.allChannels">全部声道</button></div><p id="channel-help" class="muted"></p><div id="channel-presets" class="channel-presets"></div><div id="channel-buttons" class="channel-buttons"></div></section>
<p class="muted settings-footnote" data-i18n="settings.directoryFootnote">选择游戏根目录或 game 文件夹，程序会自动寻找其中的 game/sqpack。音频只在本机读取；也可以直接拖入文件夹。</p>
</dialog>
